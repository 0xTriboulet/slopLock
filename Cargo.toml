[package]
name = "sloplock"
version = "0.1.0"
edition = "2021"
description = "Disk encryption utility for document files (development utility)"
license = "MIT"

[dependencies]
aead = "0.5"
aes = "0.8"
aes-gcm = "0.10"
clap = { version = "4", features = ["derive"] }
digest = "0.10"
hex = "0.4"
rand = "0.9"
sha2 = "0.10"
thiserror = "2"
walkdir = "2"
whoami = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
warnings = "deny"
